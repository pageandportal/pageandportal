# Page and Portal website — deployment & repo (used by agents at build time)

github.org=pageandportal
github.repo=pageandportal
github.url=https://github.com/pageandportal/pageandportal
github.clone=git@github.com:pageandportal/pageandportal.git

# GitHub Pages — project site (not user/org root site)
github.pagesType=project
github.pagesUrl=https://pageandportal.github.io/pageandportal/

# Astro (set in astro.config.mjs when Phase 0 runs)
astro.site=https://pageandportal.github.io
astro.base=/pageandportal/
